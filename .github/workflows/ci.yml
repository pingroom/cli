name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Verify the Action pins a published CLI
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pin = readFileSync('action.yml', 'utf8').match(/@pingroom\/cli@\d+\.\d+\.\d+/)?.[0];
          if (!pin) throw new Error('Action must pin a concrete CLI release');
          execFileSync('npm', ['view', pin, 'version'], { stdio: 'inherit' });
          NODE
      - run: npm test
