name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Verify the Action matches the published CLI release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdtempSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const pin = readFileSync('action.yml', 'utf8').match(/@pingroom\/cli@\d+\.\d+\.\d+/)?.[0];
          if (!pin) throw new Error('Action must pin a concrete CLI release');
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (pin !== `@pingroom/cli@${version}`) {
            throw new Error(`Publish CLI ${version}, then update the Action pin to match`);
          }
          execFileSync('npm', ['view', pin, 'version'], { stdio: 'inherit' });
          const directory = mkdtempSync(join(tmpdir(), 'pingroom-action-cli-'));
          execFileSync('npm', ['install', '--prefix', directory, '--ignore-scripts', '--no-audit', '--no-fund', pin], { stdio: 'inherit' });
          const cli = join(directory, 'node_modules', '@pingroom', 'cli', 'bin', 'pingroom.js');
          appendFileSync(process.env.GITHUB_ENV, `PINGROOM_ACTION_TEST_CLI=${cli}\n`);
          NODE
      # The script leaves its glob unquoted so the shell expands it: Node 20
      # treats a quoted glob literally.
      - run: npm test
