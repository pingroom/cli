name: 'PingRoom Notify'
description: 'Send a PingRoom ping — or hand a deploy/CI decision to a human and block on their answer.'
author: 'PingRoom'
branding:
  icon: 'bell'
  color: 'red'

inputs:
  message:
    description: 'Ping body (max 120 private / 160 public), or the Question/Handoff prompt (required; separate 500-char limit).'
    required: true
  webhook-url:
    description: 'Room webhook URL. Best for CI — carries its own secret, no browser auth. Store it as a secret.'
    required: false
  token:
    description: 'Agent access token (alternative to webhook-url; use with `room`). Required for handoffs.'
    required: false
  room:
    description: 'Room invite code (used with `token`).'
    required: false
  title:
    description: 'Ping title (<= 40 chars).'
    required: false
  action:
    description: 'Quick-action slot 1–4 to attribute the ping to.'
    required: false
  data:
    description: 'Extra JSON data object, e.g. {"commit":"abc123"}.'
    required: false
  url:
    description: 'Make the ping a tappable link: absolute http(s) URL (<= 2048 chars).'
    required: false
  button-label:
    description: 'Link button text (<= 26 chars; requires `url`).'
    required: false
  urgent:
    description: 'Deliver the ping time-sensitive so it breaks through Focus / Do Not Disturb. Delivery priority only - independent of `require-ack`, and it asks nothing of the recipient.'
    required: false
    default: 'false'
  require-ack:
    description: 'Keep the ping open until one eligible recipient acknowledges it, showing a lock-screen card with an Acknowledge button. Does not raise the interruption level on its own - set `urgent` too for an acknowledgement that also cuts through Focus.'
    required: false
    default: 'false'
  ack-timeout:
    description: 'Optional acknowledgement deadline in seconds (requires `require-ack: true`).'
    required: false
  handoff:
    description: 'Send a handoff instead of a ping (hands a decision to a specific human). Requires `token`.'
    required: false
    default: 'false'
  question:
    description: 'For a handoff: make it a question rather than a simple acknowledge. Implied when `options` is set.'
    required: false
    default: 'false'
  options:
    description: 'Answer options as value:label, one per line (preferred), e.g. "deploy:Deploy\nhold:Hold". Trailing newlines are ignored, so a value that is a single line after trimming still splits on commas — a label containing a comma MUST use the newline form. Between 2 and 4.'
    required: false
  scope:
    description: 'For an ask: who may answer — "direct" (default, the connecting account) or "room" (anyone in the room).'
    required: false
  target:
    description: 'Recipient. For a handoff: "me" (default) or a specific user uuid. For an ask: a specific room member uuid — "me" is NOT accepted there and is rejected by the API.'
    required: false
  expires-in:
    description: 'For a handoff: expiry in seconds (120..86400, default 900).'
    required: false
  urgency:
    description: 'For a handoff: "active" (default) or "passive".'
    required: false
  idempotency-key:
    description: 'For a handoff: dedupe key sent as Idempotency-Key; retries reuse it.'
    required: false
  correlation-id:
    description: 'For a handoff: opaque id echoed on every read.'
    required: false
  reply-to:
    description: 'For a handoff: opaque reply-to id echoed back.'
    required: false
  wait:
    description: 'For a handoff: block until acked / answered / expired / cancelled.'
    required: false
    default: 'false'
  ask:
    description: 'Ask a room question instead of sending a ping (requires `token` and `room`). With `wait`, blocks until it is answered.'
    required: false
    default: 'false'
  context:
    description: 'For an ask: secondary line under the prompt, e.g. a build number (<= 40 chars).'
    required: false
  timeout:
    description: 'For an ask with `wait`: per long-poll hold in seconds (0-30, default 25).'
    required: false
  api:
    description: 'API base URL override (self-hosted or staging). Passed as PINGROOM_API_URL, so it applies to every mode.'
    required: false

outputs:
  handoff-id:
    description: 'The id of the created handoff (handoff mode only).'
    value: ${{ steps.pingroom.outputs.handoff-id }}
  question-id:
    description: 'The id of the created question (ask mode only).'
    value: ${{ steps.pingroom.outputs.question-id }}
  state:
    description: 'Terminal handoff or question state: acked | answered | expired | cancelled (or open/pending without wait).'
    value: ${{ steps.pingroom.outputs.state }}
  acknowledged-by:
    description: 'The user id that acknowledged an ack handoff.'
    value: ${{ steps.pingroom.outputs.acknowledged-by }}
  answer:
    description: 'The chosen value of an answered question — handoff or ask (any value, including a negative one).'
    value: ${{ steps.pingroom.outputs.answer }}
  delivery-state:
    description: 'Initial delivery state of the handoff: enqueued | pending | failed.'
    value: ${{ steps.pingroom.outputs.delivery-state }}

runs:
  using: 'composite'
  steps:
    - id: pingroom
      shell: bash
      env:
        # Secrets are mapped to env, never echoed to the log.
        PINGROOM_WEBHOOK_URL: ${{ inputs.webhook-url }}
        PINGROOM_TOKEN: ${{ inputs.token }}
        # An API override belongs in the environment, not on the command line:
        # the CLI already resolves PINGROOM_API_URL for every command, so one
        # env var covers ping, ask and handoff with no per-branch flag.
        PINGROOM_API_URL: ${{ inputs.api }}
        PR_MESSAGE: ${{ inputs.message }}
        PR_TITLE: ${{ inputs.title }}
        PR_ACTION: ${{ inputs.action }}
        PR_DATA: ${{ inputs.data }}
        PR_URL: ${{ inputs.url }}
        PR_BUTTON_LABEL: ${{ inputs.button-label }}
        PR_ROOM: ${{ inputs.room }}
        PR_URGENT: ${{ inputs.urgent }}
        PR_REQUIRE_ACK: ${{ inputs.require-ack }}
        PR_ACK_TIMEOUT: ${{ inputs.ack-timeout }}
        PR_HANDOFF: ${{ inputs.handoff }}
        PR_QUESTION: ${{ inputs.question }}
        PR_OPTIONS: ${{ inputs.options }}
        PR_TARGET: ${{ inputs.target }}
        PR_SCOPE: ${{ inputs.scope }}
        PR_EXPIRES_IN: ${{ inputs.expires-in }}
        PR_URGENCY: ${{ inputs.urgency }}
        PR_IDEMPOTENCY_KEY: ${{ inputs.idempotency-key }}
        PR_CORRELATION_ID: ${{ inputs.correlation-id }}
        PR_REPLY_TO: ${{ inputs.reply-to }}
        PR_WAIT: ${{ inputs.wait }}
        PR_ASK: ${{ inputs.ask }}
        PR_CONTEXT: ${{ inputs.context }}
        PR_TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -o pipefail
        # Release gate: keep the Action on an npm-published version. Advance
        # this independently only after the matching CLI package is public.
        CLI="npx --yes @pingroom/cli@0.9.0"

        # Split an options input into the PR_OPTS array, one value:label spec per
        # element.
        #
        # Trailing whitespace is stripped FIRST, then the separator is chosen.
        # Order matters: a YAML block scalar (`options: |`) always appends a
        # trailing newline, so testing before the strip sent even a single-line
        # block scalar down the newline path and produced ONE option whose label
        # had swallowed the commas and the rest of the line.
        #
        # After the strip: if a newline still remains, newlines are the only
        # separator, so a label may itself contain commas ("ship:Ship it, now").
        # Otherwise the value splits on commas — which is why a comma-bearing
        # label must be written one-per-line.
        split_options() {
          PR_OPTS=()
          local raw="$1" src opt
          raw="${raw%"${raw##*[![:space:]]}"}"
          if [ "${raw#*$'\n'}" != "$raw" ]; then
            src="$raw"
          else
            src="$(printf '%s' "$raw" | tr ',' '\n')"
          fi
          while IFS= read -r opt; do
            opt="$(printf '%s' "$opt" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -n "$opt" ] && PR_OPTS+=("$opt")
          done <<< "$src"
        }

        if [ "$PR_HANDOFF" = "true" ]; then
          args=(handoff -m "$PR_MESSAGE")
          [ "$PR_QUESTION" = "true" ] && args+=(--question)
          if [ -n "$PR_OPTIONS" ]; then
            split_options "$PR_OPTIONS"
            for opt in "${PR_OPTS[@]}"; do args+=(-o "$opt"); done
          fi
          [ -n "$PR_TARGET" ]          && args+=(--target "$PR_TARGET")
          [ -n "$PR_EXPIRES_IN" ]      && args+=(--expires-in "$PR_EXPIRES_IN")
          [ -n "$PR_URGENCY" ]         && args+=(--urgency "$PR_URGENCY")
          [ -n "$PR_IDEMPOTENCY_KEY" ] && args+=(--idempotency-key "$PR_IDEMPOTENCY_KEY")
          [ -n "$PR_CORRELATION_ID" ]  && args+=(--correlation-id "$PR_CORRELATION_ID")
          [ -n "$PR_REPLY_TO" ]        && args+=(--reply-to "$PR_REPLY_TO")
          [ -n "$PR_DATA" ]            && args+=(-d "$PR_DATA")
          [ "$PR_WAIT" = "true" ]      && args+=(--wait)

          # The CLI writes only its fixed output allowlist using GitHub's
          # random-delimiter multiline protocol. Never parse untrusted answer
          # text from stdout into $GITHUB_OUTPUT.
          set +e
          $CLI "${args[@]}" --github-output "$GITHUB_OUTPUT"
          code=$?
          set -e
          exit $code
        fi

        if [ "$PR_ASK" = "true" ]; then
          args=(ask -p "$PR_MESSAGE" --room "$PR_ROOM")
          if [ -n "$PR_OPTIONS" ]; then
            split_options "$PR_OPTIONS"
            for opt in "${PR_OPTS[@]}"; do args+=(-o "$opt"); done
          fi
          [ -n "$PR_CONTEXT" ]        && args+=(-c "$PR_CONTEXT")
          [ -n "$PR_SCOPE" ]          && args+=(--scope "$PR_SCOPE")
          [ -n "$PR_TARGET" ]         && args+=(--target "$PR_TARGET")
          [ -n "$PR_CORRELATION_ID" ] && args+=(--correlation-id "$PR_CORRELATION_ID")
          [ -n "$PR_REPLY_TO" ]       && args+=(--reply-to "$PR_REPLY_TO")
          [ -n "$PR_DATA" ]           && args+=(-d "$PR_DATA")
          [ -n "$PR_TIMEOUT" ]        && args+=(--timeout "$PR_TIMEOUT")
          [ "$PR_WAIT" = "true" ]     && args+=(--wait)

          # Same posture as the handoff branch: the CLI owns $GITHUB_OUTPUT and
          # writes a fixed allowlist through the random-delimiter protocol.
          set +e
          $CLI "${args[@]}" --github-output "$GITHUB_OUTPUT"
          code=$?
          set -e
          exit $code
        fi

        args=(ping -m "$PR_MESSAGE")
        [ -n "$PR_TITLE" ]  && args+=(-t "$PR_TITLE")
        [ -n "$PR_ACTION" ] && args+=(-a "$PR_ACTION")
        [ -n "$PR_DATA" ]   && args+=(-d "$PR_DATA")
        [ -n "$PR_URL" ]    && args+=(--url "$PR_URL")
        [ -n "$PR_BUTTON_LABEL" ] && args+=(--button-label "$PR_BUTTON_LABEL")
        [ -n "$PR_ROOM" ]   && args+=(--room "$PR_ROOM")
        [ "$PR_URGENT" = "true" ] && args+=(--urgent)
        [ "$PR_REQUIRE_ACK" = "true" ] && args+=(--require-ack)
        [ -n "$PR_ACK_TIMEOUT" ] && args+=(--ack-timeout "$PR_ACK_TIMEOUT")
        $CLI "${args[@]}"
